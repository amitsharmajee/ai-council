server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass https://ai-council-backend-lgt0.onrender.com/api/;

        proxy_http_version 1.1;

        # Required for HTTPS/SNI with Render
        proxy_ssl_server_name on;
        proxy_ssl_name ai-council-backend-lgt0.onrender.com;

        proxy_set_header Host ai-council-backend-lgt0.onrender.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
	proxy_set_header Origin "";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}