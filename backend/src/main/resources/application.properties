spring.application.name=ai-council-backend

server.port=${PORT:1010}
server.address=0.0.0.0

# Spring Profiles
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# OpenAPI / Swagger config
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# MongoDB Configuration
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/ai_council}

# AI Engine Mode: MOCK (simulated for demo/testing) or LIVE (real API calls)
ai.mode=${AI_MODE:MOCK}

# Stage 1 Execution Timeout (in seconds)
stage1.timeout.seconds=${STAGE1_TIMEOUT_SECONDS:35}

# OpenRouter Configuration
openrouter.api.key=${OPENROUTER_API_KEY:}
openrouter.api.url=${OPENROUTER_API_URL:https://openrouter.ai/api/v1/chat/completions}
openrouter.model=${OPENROUTER_MODEL:openrouter/free}


# Google Gemini Configuration
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.url=${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta/models}
gemini.model=${GEMINI_MODEL:gemini-3.5-flash}

# Groq Configuration
groq.api.key=${GROQ_API_KEY:}
groq.api.url=${GROQ_API_URL:https://api.groq.com/openai/v1/chat/completions}
groq.model=${GROQ_MODEL:llama-3.3-70b-versatile}
